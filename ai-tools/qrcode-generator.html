<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator — Miao's Tools</title>
<style>
  :root {
    --bg: #1a1a2e;
    --card: #16213e;
    --text: #e0e0e0;
    --muted: #8892a4;
    --primary: #E67E22;
    --border: #2a2a4a;
    --input-bg: #0f0f23;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
  }
  .container { max-width: 750px; margin: 0 auto; }

  .header { text-align: center; padding: 28px 0 20px; }
  .header .icon { font-size: 48px; }
  .header h1 { font-size: 26px; margin: 10px 0 4px; color: var(--primary); }
  .header .sub { font-size: 13px; color: var(--muted); letter-spacing: 1px; }

  .nav-bar {
    display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;
  }
  .nav-bar a {
    color: var(--muted); text-decoration: none; font-size: 13px;
    padding: 6px 14px; border-radius: 20px; background: var(--card);
    transition: all 0.15s;
  }
  .nav-bar a:hover { color: var(--primary); background: #1e2a4a; }

  .section {
    background: var(--card);
    border-radius: var(--radius);
    padding: 22px;
    border: 1px solid var(--border);
    margin-bottom: 16px;
  }

  .row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .field { flex: 1; min-width: 200px; margin-bottom: 10px; }
  .field label {
    display: block; font-size: 12px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px;
  }
  .field input, .field select, .field textarea {
    width: 100%; padding: 10px 14px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--input-bg);
    color: var(--text); font-size: 14px;
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
  }
  .field textarea { resize: vertical; min-height: 70px; }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: var(--primary);
  }

  button {
    padding: 10px 22px; border: none; border-radius: 6px;
    cursor: pointer; font-size: 14px; font-weight: 600;
    transition: all 0.15s; white-space: nowrap;
  }
  .btn-primary { background: var(--primary); color: #1a1a2e; }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-secondary { background: var(--border); color: var(--text); }
  .btn-secondary:hover { background: #3a3a5a; }

  .qr-display {
    text-align: center;
    padding: 30px 20px;
    min-height: 200px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .qr-placeholder {
    color: var(--muted);
    font-size: 14px;
  }
  .qr-placeholder .icon { font-size: 60px; margin-bottom: 10px; }
  canvas { border-radius: 8px; }

  .footer {
    text-align: center; padding: 30px 0; font-size: 12px; color: var(--muted);
  }
  .footer a { color: var(--primary); text-decoration: none; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <!-- <div class="icon">📱</div> -->
    <h1>QR Code Generator</h1>
    <div class="sub">Text / URL → QR Code · Download PNG</div>
  </div>

  <div class="nav-bar">
    <a href="/ai-tools/">← Back to Toolbox</a>
    <a href="/">Home</a>
  </div>

  <div class="section">
    <div class="row">
      <div class="field">
        <label>Content (text or URL)</label>
        <textarea id="qrText" placeholder="Enter text or URL...">https://sylvanmiao.github.io/</textarea>
      </div>
    </div>
    <div class="row">
      <div class="field" style="flex:0.5; min-width:120px;">
        <label>Size (px)</label>
        <select id="qrSize">
          <option value="200">200</option>
          <option value="256" selected>256</option>
          <option value="320">320</option>
          <option value="400">400</option>
          <option value="512">512</option>
        </select>
      </div>
      <div class="field" style="flex:0.5; min-width:120px;">
        <label>Error Correction</label>
        <select id="qrLevel">
          <option value="L">L (7%)</option>
          <option value="M" selected>M (15%)</option>
          <option value="Q">Q (25%)</option>
          <option value="H">H (30%)</option>
        </select>
      </div>
      <button class="btn-primary" onclick="generateQR()">▶ Generate</button>
      <button class="btn-secondary" onclick="downloadQR()">💾 Download PNG</button>
    </div>
  </div>

  <div class="section">
    <div id="qrDisplay" class="qr-display">
      <div class="qr-placeholder">
        <div class="icon">📱</div>
        <div>Click "Generate" to create QR code</div>
      </div>
    </div>
  </div>

  <!-- <div class="footer">
    <a href="/ai-tools/">🧰 Miao's AI Toolbox</a> · Powered by <a href="https://github.com/davidshimjs/qrcodejs" target="_blank">qrcodejs</a> · Pure HTML · Runs in Browser
  </div> -->
</div>

<!-- QR Code library from CDN -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
let currentQR = null;

function generateQR() {
  const text = document.getElementById('qrText').value.trim();
  const size = parseInt(document.getElementById('qrSize').value);
  const level = document.getElementById('qrLevel').value;

  if (!text) {
    document.getElementById('qrDisplay').innerHTML =
      '<div class="qr-placeholder"><div class="icon">⚠️</div><div>Please enter some text first</div></div>';
    return;
  }

  // Map level
  const levelMap = { L: 1, M: 0, Q: 3, H: 2 };

  document.getElementById('qrDisplay').innerHTML = '';

  currentQR = new QRCode(document.getElementById('qrDisplay'), {
    text: text,
    width: size,
    height: size,
    colorDark: '#e0e0e0',
    colorLight: '#16213e',
    correctLevel: levelMap[level]
  });
}

function downloadQR() {
  const canvas = document.querySelector('#qrDisplay canvas');
  if (!canvas) {
    // If no QR yet, generate first
    if (!currentQR) {
      generateQR();
      setTimeout(downloadQR, 300);
      return;
    }
    alert('Please generate the QR code first.');
    return;
  }

  const link = document.createElement('a');
  link.download = 'qrcode.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

// Generate on load
window.addEventListener('load', function() {
  generateQR();
});
</script>
</body>
</html>
