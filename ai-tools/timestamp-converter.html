<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timestamp Converter — Miao's Tools</title>
<style>
  :root {
    --bg: #1a1a2e;
    --card: #16213e;
    --text: #e0e0e0;
    --muted: #8892a4;
    --primary: #2ECC71;
    --border: #2a2a4a;
    --input-bg: #0f0f23;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
  }
  .container { max-width: 800px; margin: 0 auto; }

  .header { text-align: center; padding: 28px 0 20px; }
  .header .icon { font-size: 48px; }
  .header h1 { font-size: 26px; margin: 10px 0 4px; color: var(--primary); }
  .header .sub { font-size: 13px; color: var(--muted); letter-spacing: 1px; }

  .nav-bar {
    display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;
  }
  .nav-bar a {
    color: var(--muted); text-decoration: none; font-size: 13px;
    padding: 6px 14px; border-radius: 20px; background: var(--card);
    transition: all 0.15s;
  }
  .nav-bar a:hover { color: var(--primary); background: #1e2a4a; }

  /* Live clock */
  .live-clock {
    text-align: center;
    padding: 20px;
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    margin-bottom: 20px;
  }
  .live-clock .now-label {
    font-size: 12px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 2px; margin-bottom: 4px;
  }
  .live-clock .now-time {
    font-size: 38px; font-weight: bold; color: var(--primary);
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    letter-spacing: 2px;
  }
  .live-clock .now-ts {
    font-size: 14px; color: var(--muted); margin-top: 4px;
    font-family: 'JetBrains Mono', monospace;
  }

  /* Converter section */
  .section {
    background: var(--card);
    border-radius: var(--radius);
    padding: 22px;
    border: 1px solid var(--border);
    margin-bottom: 16px;
  }
  .section-title {
    font-size: 14px; font-weight: 600; color: var(--primary);
    text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }

  .row {
    display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap;
  }
  .field { flex: 1; min-width: 180px; }
  .field label {
    display: block; font-size: 12px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px;
  }
  .field input, .field select {
    width: 100%; padding: 10px 14px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--input-bg);
    color: var(--text); font-size: 14px;
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
  }
  .field input:focus, .field select:focus {
    outline: none; border-color: var(--primary);
  }

  button {
    padding: 10px 22px; border: none; border-radius: 6px;
    cursor: pointer; font-size: 14px; font-weight: 600;
    transition: all 0.15s; white-space: nowrap;
  }
  .btn-primary { background: var(--primary); color: #1a1a2e; }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-secondary { background: var(--border); color: var(--text); }
  .btn-secondary:hover { background: #3a3a5a; }

  .result {
    margin-top: 14px; padding: 14px; border-radius: 6px;
    background: var(--input-bg); border: 1px solid var(--border);
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    font-size: 13px; line-height: 1.8;
  }
  .result .label { color: var(--muted); margin-right: 8px; }
  .result .val { color: var(--primary); }

  .footer {
    text-align: center; padding: 30px 0; font-size: 12px; color: var(--muted);
  }
  .footer a { color: var(--primary); text-decoration: none; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <!-- <div class="icon">⏱️</div> -->
    <h1>Timestamp Converter</h1>
    <div class="sub">Unix Timestamp ↔ Human Date · Real-time Clock</div>
  </div>

  <div class="nav-bar">
    <a href="/ai-tools/">← Back to Toolbox</a>
    <a href="/">Home</a>
  </div>

  <!-- Live Clock -->
  <div class="live-clock">
    <div class="now-label">🕐 Current Time</div>
    <div id="nowTime" class="now-time">--</div>
    <div class="now-ts">Unix: <span id="nowTs">--</span> (s) | <span id="nowTsMs">--</span> (ms)</div>
  </div>

  <!-- Timestamp → Date -->
  <div class="section">
    <div class="section-title">📥 Timestamp → Date</div>
    <div class="row">
      <div class="field">
        <label>Timestamp</label>
        <input id="tsInput" type="text" placeholder="e.g. 1700000000 or 1700000000000">
      </div>
      <button class="btn-primary" onclick="tsToDate()">▶ Convert</button>
      <button class="btn-secondary" onclick="document.getElementById('tsInput').value = Math.floor(Date.now()/1000); tsToDate();">Now</button>
    </div>
    <div id="tsResult" class="result" style="display:none;"></div>
  </div>

  <!-- Date → Timestamp -->
  <div class="section">
    <div class="section-title">📤 Date → Timestamp</div>
    <div class="row">
      <div class="field">
        <label>Date & Time</label>
        <input id="dtInput" type="datetime-local" step="1">
      </div>
      <button class="btn-primary" onclick="dateToTs()">▶ Convert</button>
      <button class="btn-secondary" onclick="setNow(); dateToTs();">Now</button>
    </div>
    <div id="dtResult" class="result" style="display:none;"></div>
  </div>

  <!-- <div class="footer">
    <a href="/ai-tools/">🧰 Miao's AI Toolbox</a> · Pure HTML · Runs in Browser
  </div> -->
</div>

<script>
// Live clock
function updateClock() {
  const now = new Date();
  document.getElementById('nowTime').textContent = now.toLocaleString('zh-CN', {
    year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit',
    hour12: false
  });
  document.getElementById('nowTs').textContent = Math.floor(now.getTime() / 1000);
  document.getElementById('nowTsMs').textContent = now.getTime();
}
updateClock();
setInterval(updateClock, 200);

function setNow() {
  const now = new Date();
  // Format for datetime-local input: YYYY-MM-DDTHH:mm:ss
  const s = now.getFullYear() + '-' +
    String(now.getMonth()+1).padStart(2,'0') + '-' +
    String(now.getDate()).padStart(2,'0') + 'T' +
    String(now.getHours()).padStart(2,'0') + ':' +
    String(now.getMinutes()).padStart(2,'0') + ':' +
    String(now.getSeconds()).padStart(2,'0');
  document.getElementById('dtInput').value = s;
}

function tsToDate() {
  const el = document.getElementById('tsResult');
  let val = document.getElementById('tsInput').value.trim();
  if (!val) { el.style.display='none'; return; }

  let ts = parseInt(val, 10);
  if (isNaN(ts)) { el.innerHTML = '<span style="color:#e74c3c">✗ Invalid timestamp</span>'; el.style.display='block'; return; }

  // Auto-detect: if > 1000000000000, assume milliseconds
  const isMs = ts > 1000000000000;
  const date = new Date(isMs ? ts : ts * 1000);
  const sec = isMs ? Math.floor(ts / 1000) : ts;
  const ms = isMs ? ts : ts * 1000;

  el.innerHTML =
    '<span class="label">UTC:</span><span class="val">' + date.toUTCString() + '</span><br>' +
    '<span class="label">Local:</span><span class="val">' + date.toLocaleString('zh-CN', {hour12:false}) + '</span><br>' +
    '<span class="label">ISO 8601:</span><span class="val">' + date.toISOString() + '</span><br>' +
    '<span class="label">Seconds:</span><span class="val">' + sec.toLocaleString() + '</span><br>' +
    '<span class="label">Milliseconds:</span><span class="val">' + ms.toLocaleString() + '</span><br>' +
    '<span class="label">Day:</span><span class="val">' + ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][date.getUTCDay()] + '</span>';
  el.style.display = 'block';
}

function dateToTs() {
  const el = document.getElementById('dtResult');
  const val = document.getElementById('dtInput').value;
  if (!val) { el.style.display='none'; return; }

  const date = new Date(val);
  const sec = Math.floor(date.getTime() / 1000);
  const msec = date.getTime();

  el.innerHTML =
    '<span class="label">Seconds (s):</span><span class="val">' + sec.toLocaleString() + '</span><br>' +
    '<span class="label">Milliseconds (ms):</span><span class="val">' + msec.toLocaleString() + '</span><br>' +
    '<span class="label">UTC:</span><span class="val">' + date.toUTCString() + '</span><br>' +
    '<span class="label">ISO 8601:</span><span class="val">' + date.toISOString() + '</span>';
  el.style.display = 'block';
}

// Initialize
setNow();
</script>
</body>
</html>
